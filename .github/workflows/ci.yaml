name: agent and server CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'backend/**'
      - 'agent/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'backend/**'
      - 'agent/**'
      - '.github/workflows/ci.yaml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Copy env template
        run: |
          cd server
          cp .env.example .env

      - name: Run Linters
        run: |
          task lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy env template
        run: |
          cd server
          cp .env.example .env

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run Tests
        run: |
          go test -v -cover ./agent/...
          go test -v -cover ./server/...
          go test -v -cover ./pkg/...

