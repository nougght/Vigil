name: agent and server CI

on:
  push:
    branches: 
      - '**'
    paths:
      - 'server/**' 
      - 'agent/**'
  pull_request:
    branches: 
      - '**'
    paths:
      - 'server/**'
      - 'agent/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy env template
        run: |
          cd server
          cp .env.example .env

      - name: Run Linters
        run: |
          make lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy env template
        run: |
          cd server
          cp .env.example .env

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run Tests
        run: |
          go test -v -cover ./agent/...
          go test -v -cover ./server/...
          go test -v -cover ./shared/go/...

