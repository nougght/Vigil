name: frontend CI


on:
  push:
    branches: ['**']
    paths:
      - 'web/**'
      - '.github/workflows/frontend-ci.yaml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/frontend-ci.yaml'


jobs:
  build:
    runs-on: ubuntu-latest
    strategy:            # separate jobs for packages
      fail-fast: false   # don't exit on single job fail
      matrix:
        include:
          - pkg: web-panel
            out: web/web-panel/dist
          - pkg: agent-ui
            out: agent/static/files

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint --workspace=${{ matrix.pkg }}

      - name: Build
        working-directory: web
        run: npm run build --workspace=${{ matrix.pkg }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: ${{ matrix.out }}
          if-no-files-found: error
          retention-days: 14