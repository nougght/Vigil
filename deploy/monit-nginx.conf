server {
    listen 80;

    server_name monitoring.nought.ru;
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/monitoring.nought.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.nought.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    # web static files
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;  # for spa routing
    }

    # backend api
    location /api/ {
        proxy_pass http://monitoring-backend:8091; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ws {
        proxy_pass http://monitoring-backend:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;      
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  3600s;                      
        proxy_send_timeout  3600s;
        proxy_buffering off;                            
    }
}
