services:
  timescale:
    image: timescale/timescaledb-ha:pg18
    environment:
      POSTGRES_DB: "timescale"
      PGDATA: /home/postgres/pgdata/data
    volumes:
      - db-data:/home/postgres/pgdata
    ports:
      - "5433:5432"
    env_file:
      - ./.env
  
  monitoring-core:
    build:
      # repo root so /pkg is available for the go.mod replace
      context: ..
      dockerfile: backend/services/core/docker/core.Dockerfile
    image: monitoring-core
    networks:
          default:
          proxy:

    ports:
      - "8091:8091"
      - "8092:8092"
      - "8093:8093" 
      
    env_file:
      - ../backend/services/core/.env
      
    environment:
      POSTGRES_HOST: "timescale"
      POSTGRES_PORT: "5432"
      NATS_URL: "nats:4222"
      CA_PATH: ${CONTAINER_CA_PATH}
      INT_CA_PATH:  ${CONTAINER_INT_CA_PATH}
      INT_KEY_PATH: ${CONTAINER_INT_KEY_PATH}

    depends_on:
      - timescale
    stop_grace_period: 10s
    volumes:
      - ${HOST_CREDS_PATH}:${CONTAINER_CREDS_PATH}

  monitoring-alerts:
    build:
      # repo root so /pkg is available for the go.mod replace
      context: ..
      dockerfile: backend/services/alerts/docker/alerts.Dockerfile
    image: monitoring-alerts
    networks:
      default:
      proxy:


    env_file:
      - ../backend/services/alerts/.env

    environment:
      NATS_URL: "nats:4222"

    depends_on:
      - timescale
      - monitoring-core
    stop_grace_period: 10s

  nats:
    image: nats:2.11-alpine
    container_name: nats-server
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    command: ["-js", "-sd", "/data"] # -js for JetStream, -sd for data path
    restart: unless-stopped

volumes:
  db-data:
  nats_data:
  
networks:
  proxy:
    external: true